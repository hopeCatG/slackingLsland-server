services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: slack-off-api:latest
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:28080:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
